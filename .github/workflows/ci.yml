name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test · Build · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release artifact
        run: npm run verify

      - name: Package release ZIP
        run: npm run package

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: orvexa-studio-dist
          path: dist/
          retention-days: 14

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: orvexa-studio-release
          path: release/
          retention-days: 14

  deploy:
    name: Deploy to Netlify
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: orvexa-studio-dist
          path: dist

      - name: Deploy
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID" --message "Orvexa Studio ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
